name: 🧩 Backend CI (Server)

on:
  pull_request:
    paths:
      - "apps/server/**"
      # Shared configuration can break the server without touching apps/server.
      - "turbo.json"
      - "vitest.config.ts"
      - "tsconfig.base.json"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/server.yml"
      - ".github/actions/**"
  # Anything reaching master (direct push or merge queue) is validated too, so a change that no
  # path filter matched can never land untested.
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read
  checks: write
  pull-requests: write
  deployments: write
  statuses: write

env:
  TURBO_CACHE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'local:,remote:r' || 'local:,remote:rw' }}
  TURBO_TELEMETRY_DISABLED: "1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    # No label guard here: release pull requests must run the tests like any other change.
    name: 🧼 Lint Code
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.migrations.outputs.migrations }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: 🔍 Detect migration changes
        id: migrations
        uses: dorny/paths-filter@v4
        with:
          filters: |
            migrations:
              - 'apps/server/src/db/migrations/**'
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 🧼 Run ESLint & Prettier
        run: pnpm turbo run server#check:lint --cache="${{env.TURBO_CACHE}}"

  typecheck:
    name: 🧠 Type Check
    runs-on: ubuntu-latest

    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 🧠 Run TS Check
        run: pnpm turbo run server#check:types --cache="${{env.TURBO_CACHE}}"

  knip:
    name: 🪓 Check Unused Code (knip + ts-prune)
    runs-on: ubuntu-latest

    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: create env file
        working-directory: apps/server
        run: |
          cat <<EOF > .env
          SESSION_SECRET='test_session_secret'
          BETTER_AUTH_SECRET='test_better_auth_secret'
          EOF
      - name: 🪓 Run Knip
        run: pnpm turbo run server#check:knip --cache="${{env.TURBO_CACHE}}"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
  depcheck:
    name: 📦 Check Unused Dependencies
    runs-on: ubuntu-latest

    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 📦 Run depcheck
        run: pnpm turbo run server#check:dep --cache="${{env.TURBO_CACHE}}"
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, knip, depcheck]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm

      - name: 🧪 Run Tests (unit + API integration)
        run: pnpm turbo run server#check:test

      - name: 🧾 Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: apps/server/reports/junit.xml
          check_name: "Server Tests"
          detailed_summary: true
          include_passed: false
          annotate_only: false
          fail_on_failure: true
          require_tests: true

      - name: 📎 Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: |
            apps/server/reports/junit.xml
            apps/server/coverage
          retention-days: 14

      - name: 📈 Report Coverage
        # The action comments on the pull request, so it only applies to PR runs.
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "Server Coverage Report"
          json-summary-path: apps/server/coverage/coverage-summary.json
          json-final-path: apps/server/coverage/coverage-final.json
          vite-config-path: apps/server/vitest.config.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    runs-on: ubuntu-latest
    name: 🐘 Drizzle Migrations Check
    needs: lint
    if: needs.lint.outputs.migrations_changed == 'true'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm

      - name: ✅ Drizzle migrations check
        run: pnpm turbo run server#db:check
      - name: 🧾 Ensure migrations are committed
        run: |
          pnpm turbo run server#db:generate
          git diff --exit-code

      - name: 🐘 Apply migrations to fresh Postgres
        run: pnpm turbo run server#db:migrate
