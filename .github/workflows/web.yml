name: 🎨 Frontend CI (Web)

on:
  pull_request:
    paths:
      - "apps/web/**"
      # The tRPC routers and services define the API contract the web app consumes: a change
      # there can break the web build or its e2e flows without touching apps/web.
      - "apps/server/src/routers/**"
      - "apps/server/src/db/services/**"
      - "apps/server/scripts/e2eSeed.ts"
      # Shared configuration.
      - "turbo.json"
      - "vitest.config.ts"
      - "tsconfig.base.json"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
      - ".github/actions/**"
  # Anything reaching master (direct push or merge queue) is validated too.
  push:
    branches: [master]
  merge_group:

permissions:
  contents: read
  checks: write
  pull-requests: write
  deployments: write
  statuses: write

env:
  TURBO_CACHE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'local:,remote:r' || 'local:,remote:rw' }}
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # No label guard here: release pull requests must run the tests like any other change.
    name: 🧼 Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 🧼 Run ESLint & Prettier
        run: pnpm turbo run web#check:lint --cache="${{env.TURBO_CACHE}}"

  typecheck:
    name: 🧠 Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 🧠 Run TS Check
        run: pnpm turbo run web#check:types --cache="${{env.TURBO_CACHE}}"

  knip:
    name: 🪓 Check Unused Code (knip + ts-prune)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 🪓 Run Knip
        run: pnpm turbo run web#check:knip --cache="${{env.TURBO_CACHE}}"

  depcheck:
    name: 📦 Check Unused Dependencies
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 📦 Run depcheck
        run: pnpm turbo run web#check:dep --cache="${{env.TURBO_CACHE}}"

  size:
    name: 📏 Bundle Size Budget
    runs-on: ubuntu-latest
    needs: [knip, depcheck]
    env:
      CI_JOB_NUMBER: 1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 📏 Size Limit
        run: pnpm turbo run web#check:size --cache="${{env.TURBO_CACHE}}"

  audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 🛡️ Run npm audit
        run: pnpm turbo run web#check:audit --cache="${{env.TURBO_CACHE}}"

  i18n:
    name: 🌍 i18n Checks
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/setup-turbo
        with:
          token: ${{ secrets.TURBO_TOKEN }}
          team: ${{ secrets.TURBO_TEAM }}
      - name: 🌍 Run i18n CI check
        run: pnpm turbo run web#check:i18n --cache="${{env.TURBO_CACHE}}"

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, knip, depcheck, size, audit, i18n]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm
      - name: 🧪 Run Tests
        run: pnpm turbo run web#check:test

      - name: 🧾 Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: apps/web/reports/junit.xml
          check_name: "Web Tests"
          detailed_summary: true
          include_passed: false
          annotate_only: false
          fail_on_failure: true
          require_tests: true

      - name: 📎 Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report
          path: |
            apps/web/reports/junit.xml
            apps/web/coverage
          retention-days: 14

      - name: 📈 Report Coverage
        # The action comments on the pull request, so it only applies to PR runs.
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "Web Coverage Report"
          json-summary-path: apps/web/coverage/coverage-summary.json
          json-final-path: apps/web/coverage/coverage-final.json
          vite-config-path: apps/web/vitest.config.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: 🚦 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_e2e
      # Development mode keeps better-auth cookies non-secure so they survive plain http.
      NODE_ENV: development
      PORT: "3000"
      BASE_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: e2e_better_auth_secret
      SESSION_SECRET: e2e_session_secret
      CORS_ORIGIN: http://localhost:5173
      NVIDIA_API_KEY: e2e_placeholder_key
      LOG_LEVEL: warn
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: corevia
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      VITE_SERVER_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3000
      E2E_WEB_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-pnpm

      # MinIO cannot be a service container: the official image needs the `server /data`
      # command, and service containers cannot override a command. The API refuses to boot
      # without reachable object storage, hence this step runs before the migrations.
      - name: 🪣 Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is live"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become live in time" >&2
          docker logs minio || true
          exit 1

      - name: 🐘 Apply migrations
        run: pnpm turbo run server#db:migrate

      - name: 🌱 Seed the e2e dataset
        run: pnpm --filter server db:seed:e2e

      - name: 🎭 Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: 🚦 Run Playwright (flows + a11y)
        run: pnpm --filter web exec playwright test

      - name: 🧾 Publish E2E Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: apps/web/reports/e2e-junit.xml
          check_name: "Web E2E Tests"
          detailed_summary: true
          include_passed: false
          fail_on_failure: true
          require_tests: true

      - name: 📎 Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            apps/web/reports/e2e-junit.xml
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

